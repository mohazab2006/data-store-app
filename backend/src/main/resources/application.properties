spring.application.name=data-store-api

# MySQL — create database first: CREATE DATABASE data_store_db;
spring.datasource.url=jdbc:mysql://localhost:3306/data_store_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root

# Password: use backend/application-local.properties (gitignored) — see application-local.properties.example
# Or env: SPRING_DATASOURCE_PASSWORD
spring.config.import=optional:file:./application-local.properties
